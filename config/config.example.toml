[ai]
provider = "openai-compatible"
model = "your-fast-structured-output-model"
base_url = "http://127.0.0.1:11434/v1"
confidence_threshold = 0.6
# Plaintext alternative: api_key = "your-api-key"
# Remove [ai.credential] below when using api_key.

[ai.credential]
source = "env"
name = "OPENAI_API_KEY"

[display]
profile = "{scope}/{task}"

[limits]
debounce_ms = 1000
scan_interval_ms = 3000
content_settle_ms = 4000
minimum_call_interval_ms = 60000
request_timeout_ms = 15000
max_calls_per_window_hour = 6
max_calls_per_server_hour = 30
# Lower-cost alternative: minimum_call_interval_ms = 120000, 3 calls/window/hour, 15 calls/server/hour.
circuit_failure_threshold = 3
circuit_cooldown_ms = 600000
