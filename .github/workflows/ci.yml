name: CI

on:
  push:
  pull_request:

jobs:
  shellcheck:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - name: Install shellcheck
        run: sudo apt-get update && sudo apt-get install -y shellcheck
      - name: Shellcheck
        run: shellcheck tmux-autoname.tmux bin/tmux-autoname test/run.sh

  test:
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        # tmux 3.3a, 3.4 and 3.5a; /bin/sh is dash in all of them.
        image: ['debian:bookworm', 'ubuntu:24.04', 'debian:trixie']
    container: ${{ matrix.image }}
    steps:
      - name: Install system tools
        run: apt-get update && apt-get install -y tmux git zsh
      - uses: actions/checkout@v7
      - name: Test
        run: tmux -V && sh test/run.sh
