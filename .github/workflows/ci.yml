name: CI

on:
  push:
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install system tools
        run: sudo apt-get update && sudo apt-get install -y shellcheck tmux git
      - name: Shellcheck
        run: shellcheck tmux-autoname.tmux bin/tmux-autoname test/run.sh
      - name: Test
        run: sh test/run.sh
